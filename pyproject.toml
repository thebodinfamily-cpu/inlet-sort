[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inlet-sort"
version = "0.1.0"
description = "Inlet Sort: a sequential samplesort that routes values through ordered inlets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christopher M Bodin" }]
keywords = ["sort", "samplesort", "algorithm", "inlet-sort"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
inlet-sort = "inlet_sort.cli:main"

[project.urls]
Homepage = "https://github.com/thebodinfamily-cpu/inlet-sort"
Repository = "https://github.com/thebodinfamily-cpu/inlet-sort"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inlet_sort = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
