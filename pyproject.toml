[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inlet-sort"
version = "0.1.0"
description = "Inlet Sort: a sequential samplesort that routes values through ordered inlets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christopher M Bodin" }]
keywords = ["sort", "sorting", "samplesort", "algorithm", "inlet-sort", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6.0"]

[project.scripts]
inlet-sort = "inlet_sort.cli:main"

[project.urls]
Homepage = "https://github.com/thebodinfamily-cpu/inlet-sort"
Repository = "https://github.com/thebodinfamily-cpu/inlet-sort"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inlet_sort = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true

[tool.cibuildwheel]
# Build for the Python versions this project supports.
build = "cp310-* cp311-* cp312-*"
# Skip 32-bit targets; the native fast path assumes a 64-bit build.
skip = "*-win32 *_i686"
build-frontend = "build"
# Install the built wheel and run the test suite against it (not the source
# tree), which confirms the compiled extension works in the packaged wheel.
test-requires = "pytest hypothesis"
test-command = "python -m pytest {project}/tests -o pythonpath= -o addopts="
